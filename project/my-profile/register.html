<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครชมรม</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>web สมัครชมรม</h1>
        <p class="tagline">นักเรียนสายเรียน ET32203</p>
    </header>
    
    <nav>
        <a href="index.html">โปรไฟล์</a>
        <a href="register.html">สมัครชมรม</a>
    </nav>
    <main>
        <form method="get">
            <label for="fullname">ชื่อ-นามสกุล</label>
            <input type="text" id="fullname" name="fullname" required placeholder="เช่น คุณากร ใจกล้า">

            <label for="email">อีเมล</label>
            <input type="email" id="email" name="email" required placeholder="เช่น mewmew@gmail.com">

            <p>ชั้นเรียน</p>
            <input type="radio" id="m4" name="grade"
                    value="m4" required>
            <label for="m4">ม.4</label>
            <input type="radio" id="m5" name="grade"
                    value="m5" required>
            <label for="m5">ม.5</label>
            <input type="radio" id="m6" name="grade"
                    value="m6" required>
            <label for="m6">ม.6</label>

            <label for="time">ว่างช่วงไหน</label>
    <select id="time" name="time" required>
      <option value="">-- เลือกวัน --</option>
      <option value="mon">จันทร์ หลังเลิกเรียน</option>
      <option value="wed">พุธ หลังเลิกเรียน</option>
      <option value="sat">เสาร์ ช่วงเช้า</option>
    </select>

     <label for="reason">ทำไมอยากเข้าชมรม</label><br>
    <textarea id="reason" name="reason" rows="4" cols="40" placeholder="เล่าสั้นๆ" required></textarea>

        <button type="submit">ส่งใบสมัคร</button>
        </form>
</main>

<footer>
    <p>ติดต่อ: chi.trun@dome.tu.ac.th</p>
    </footer>
</body>
</html>
